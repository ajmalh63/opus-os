name = "opusos-api"
main = "src/index.ts"
compatibility_date = "2026-08-18" # keep current per Cloudflare Workers best practices
compatibility_flags = [ "nodejs_compat" ]
workers_dev = true

# ============================================================
# Cloudflare Workers Smart Placement (100% Free)
# Automatically runs worker execution in optimal data centers
# closest to D1 database to minimize multi-roundtrip network hops.
# ============================================================
[placement]
mode = "smart"

# ============================================================
# Cloudflare Workers Observability
# ============================================================
[observability]
enabled = true

[observability.logs]
enabled = true

# ============================================================
# Wave 1 — Uptime Kuma push heartbeat producer (cron).
# Every 6h the scheduled handler pings KUMA_PUSH_URL with status
# up/down (D1 reachability). Set the URL after creating the push
# monitor: prod → `wrangler secret put KUMA_PUSH_URL`.
# ============================================================
[triggers]
crons = [ "0 */6 * * *", "0 3 1 * *", "30 3 1 * *", "0 4 * * 1" ]

# NOTE — credential-bearing vars are NOT in [vars] (they would ship to any
# deploy verbatim). Local dev values live in .dev.vars (gitignored); production
# MUST use `wrangler secret put` for: ENVIRONMENT, TURNSTILE_SECRET_KEY,
# MANPOWER_AI, AUTOMATION_TOKEN, ADMIN_PASSWORD, OPENWA_API_KEY, WA_WEBHOOK_SECRET.
[vars]

# Wave 1 — Uptime Kuma push monitor URL (heartbeat cron). DEV placeholder;
# production MUST use `wrangler secret put KUMA_PUSH_URL` (never in [vars]).
KUMA_PUSH_URL = ""

# First-run owner bootstrap (auth gateway). ADMIN_EMAIL is public-safe;
# ADMIN_PASSWORD lives in .dev.vars (local) / `wrangler secret put ADMIN_PASSWORD` (prod).
ADMIN_EMAIL = "ajmalsn63@gmail.com"

# NOTE — BETTER_AUTH_SECRET is intentionally NOT in [vars] (it is a secret):
#   local dev  → put it in `.dev.vars` (gitignored)
#   production → `wrangler secret put BETTER_AUTH_SECRET` (encrypted, hidden)
# It signs better-auth session cookies and presigned upload URLs. Missing it
# makes auth + document uploads fail-closed with a clear error.

# ============================================================
# Unified messaging — TAILSCALE TEST PHASE (PENDING-CONFIGS #1)
# VPS services reachable only on the tailnet (100.87.71.38); ports
# are closed from the public internet (DOCKER-USER firewall).
# Replace with tunnel hostnames when moving to Cloudflare infra.
# ============================================================
WA_PROVIDER = "openwa"
OPENWA_BASE_URL = "http://100.87.71.38:2785"
OPENWA_API_URL = "http://100.87.71.38:2785"
OPENWA_SESSION_ID = "main"

# ERPNext back-office integration (Frappe REST) — owner-only sync endpoints
ERPNEXT_BASE_URL = "http://100.87.71.38:8080"
CHATWOOT_BASE_URL = "http://100.87.71.38:3200"
N8N_BASE_URL = "http://100.87.71.38:5678"
KUMA_BASE_URL = "http://100.87.71.38:3003"
UMAMI_BASE_URL = "http://100.87.71.38:3002"
TWENTY_BASE_URL = "http://100.87.71.38:3001"
MAUTIC_URL = "http://100.87.71.38:8085"
LISTMONK_BASE_URL = "http://100.87.71.38:9009"

account_id = "b66f3697a847cba87b1fd44bc8a13827"

[[d1_databases]]
binding = "DB"
database_name = "opusos-db"
database_id = "0cc0da81-bddf-43e8-8298-6adad0472cd9"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "opusdocs"
preview_bucket_name = "opusdocs"

# [[queues.producers]]
# queue = "opusos-jobs-queue"
# binding = "JOBS_QUEUE"

# ============================================================
# KV - cache + feature flags ONLY (Section 3.4 / 18.4.2)
# Sessions deliberately live in D1 (KV free tier = 1k writes/day).
# ============================================================
[[kv_namespaces]]
binding = "KV"
id = "578e838ad5484185875c62fe1e0adce5"
preview_id = "578e838ad5484185875c62fe1e0adce5"

# ============================================================
# Vectorize - vector database for semantic search / AI matching
# (Section 3.4 / 3.9.2). Create the index before deploy:
#   wrangler vectorize create opusos-embeddings --dimensions 768 --metric cosine
# (768 = bge-base-en-v1.5 Workers AI embeddings)
# ============================================================
[[vectorize]]
binding = "VECTOR_INDEX"
index_name = "opusos-embeddings"

# ============================================================
# Workers AI - resume parsing / embeddings / summaries
# (Section 12.2). Free tier 10k neurons/day. Binding only works
# with a real Cloudflare account; local dev passes env mock.
# ============================================================
[ai]
binding = "AI"

# ============================================================
# Durable Objects - Team Hub chat rooms (§5.5). Free tier 100k req/day.
# Local dev: DOs run in workerd via `wrangler dev --local`.
# ============================================================
[[durable_objects.bindings]]
name = "TEAM_HUB"
class_name = "TeamHubRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TeamHubRoom"]

# ============================================================
# PRODUCTION ENVIRONMENT — deploy with: wrangler deploy --env production
#   - ENVIRONMENT=production → Secure session cookies, Turnstile fail-closed,
#     OTP/reset logging disabled (see auth.ts / turnstile.ts)
#   - workers_dev=false → no public *.workers.dev exposure
#   - Secrets: `wrangler secret bulk` (see docs/DEPLOY-PRODUCTION.md)
#   - Routes: uncomment + set zone_name once opusoverseas.com is on Cloudflare
# ============================================================
[env.production]
workers_dev = false

  [env.production.vars]
  ENVIRONMENT = "production"

  # Routes to activate after the domain is added to Cloudflare:
  # [[env.production.routes]]
  # pattern = "opusoverseas.com/*"
  # zone_name = "opusoverseas.com"
  # [[env.production.routes]]
  # pattern = "www.opusoverseas.com/*"
  # zone_name = "opusoverseas.com"
  # [[env.production.routes]]
  # pattern = "app.opusoverseas.com/*"
  # zone_name = "opusoverseas.com"


