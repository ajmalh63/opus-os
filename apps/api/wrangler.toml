name = "opusos-api"
main = "src/index.ts"
compatibility_date = "2026-08-06"
compatibility_flags = [ "nodejs_compat" ]
workers_dev = true

[vars]
ENVIRONMENT = "development"
TURNSTILE_SECRET_KEY = "1x0000000000000000000000000000000AA" # Local Turnstile mock test key
# Resume parser mode (B-3). Dev/local default = "mock" (explicitly labeled demo data).
# Production MUST set MANPOWER_AI = "real" and implement the Workers AI path.
MANPOWER_AI = "mock"

# First-run owner bootstrap (auth gateway). Dev defaults; production uses secrets.
ADMIN_EMAIL = "owner@opusoverseas.com"
ADMIN_PASSWORD = "OwnerPass2026!"

# ============================================================
# Unified messaging — TAILSCALE TEST PHASE (PENDING-CONFIGS #1)
# VPS services reachable only on the tailnet (100.87.71.38); ports
# are closed from the public internet (DOCKER-USER firewall).
# Replace with tunnel hostnames when moving to Cloudflare infra.
# ============================================================
WA_PROVIDER = "openwa"
OPENWA_BASE_URL = "http://100.87.71.38:2785"
OPENWA_API_KEY = "owa_k1_6c127c65d850fa156f794cd554c3eb55f" # DEV ONLY — VPS dashboard key
OPENWA_SESSION_ID = "main"
WA_WEBHOOK_SECRET = "dev-webhook-secret-change-me"

[[d1_databases]]
binding = "DB"
database_name = "opusos-db"
database_id = "07f9c2d1-local-dev-db-id"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "opusos-vault"
preview_bucket_name = "opusos-vault-preview"

[[queues.producers]]
queue = "opusos-jobs-queue"
binding = "JOBS_QUEUE"

# ============================================================
# KV - cache + feature flags ONLY (Section 3.4 / 18.4.2)
# Sessions deliberately live in D1 (KV free tier = 1k writes/day).
# ============================================================
[[kv_namespaces]]
binding = "KV"
id = "local-kv-namespace-id"
preview_id = "local-kv-preview-id"

# ============================================================
# Vectorize - vector database for semantic search / AI matching
# (Section 3.4 / 3.9.2). Create the index before deploy:
#   wrangler vectorize create opusos-embeddings --dimensions 768 --metric cosine
# (768 = bge-base-en-v1.5 Workers AI embeddings)
# ============================================================
[[vectorize]]
binding = "VECTOR_INDEX"
index_name = "opusos-embeddings"
index_id = "local-vectorize-index-id"
