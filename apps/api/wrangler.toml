name = "opusos-api"
main = "src/index.ts"
compatibility_date = "2026-08-06"
compatibility_flags = [ "nodejs_compat" ]
workers_dev = true

# ============================================================
# Wave 1 â€” Uptime Kuma push heartbeat producer (cron).
# Every 6h the scheduled handler pings KUMA_PUSH_URL with status
# up/down (D1 reachability). Set the URL after creating the push
# monitor: prod â†’ `wrangler secret put KUMA_PUSH_URL`.
# ============================================================
[triggers]
crons = [ "0 */6 * * *" ]

[vars]
ENVIRONMENT = "development"
TURNSTILE_SECRET_KEY = "1x0000000000000000000000000000000AA" # Local Turnstile mock test key
# Resume parser mode (B-3). Dev/local default = "mock" (explicitly labeled demo data).
# Production MUST set MANPOWER_AI = "real" and implement the Workers AI path.
MANPOWER_AI = "mock"

# n8n automation lane (Wave 2) â€” service token, fail-closed. DEV ONLY value;
# production MUST use `wrangler secret put AUTOMATION_TOKEN` (never in [vars]).
AUTOMATION_TOKEN = "dev-automation-token-change-me"

# Wave 1 â€” Uptime Kuma push monitor URL (heartbeat cron). DEV placeholder;
# production MUST use `wrangler secret put KUMA_PUSH_URL` (never in [vars]).
KUMA_PUSH_URL = ""

# First-run owner bootstrap (auth gateway). Dev defaults; production uses secrets.
ADMIN_EMAIL = "owner@opusoverseas.com"
ADMIN_PASSWORD = "OwnerPass2026!"

# NOTE — BETTER_AUTH_SECRET is intentionally NOT in [vars] (it is a secret):
#   local dev  → put it in `.dev.vars` (gitignored)
#   production → `wrangler secret put BETTER_AUTH_SECRET` (encrypted, hidden)
# It signs better-auth session cookies and presigned upload URLs. Missing it
# makes auth + document uploads fail-closed with a clear error.

# ============================================================
# Unified messaging â€” TAILSCALE TEST PHASE (PENDING-CONFIGS #1)
# VPS services reachable only on the tailnet (100.87.71.38); ports
# are closed from the public internet (DOCKER-USER firewall).
# Replace with tunnel hostnames when moving to Cloudflare infra.
# ============================================================
WA_PROVIDER = "openwa"
OPENWA_BASE_URL = "http://100.87.71.38:2785"
OPENWA_API_KEY = "owa_k1_6c127c65d850fa156f794cd554c3eb55f" # DEV ONLY â€” VPS dashboard key
OPENWA_SESSION_ID = "main"
WA_WEBHOOK_SECRET = "dev-webhook-secret-change-me"

# ERPNext back-office integration (Frappe REST) â€” owner-only sync endpoints
ERPNEXT_BASE_URL = "http://100.87.71.38:8080"

[[d1_databases]]
binding = "DB"
database_name = "opusos-db"
database_id = "07f9c2d1-local-dev-db-id"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "opusos-vault"
preview_bucket_name = "opusos-vault-preview"

[[queues.producers]]
queue = "opusos-jobs-queue"
binding = "JOBS_QUEUE"

# ============================================================
# KV - cache + feature flags ONLY (Section 3.4 / 18.4.2)
# Sessions deliberately live in D1 (KV free tier = 1k writes/day).
# ============================================================
[[kv_namespaces]]
binding = "KV"
id = "local-kv-namespace-id"
preview_id = "local-kv-preview-id"

# ============================================================
# Vectorize - vector database for semantic search / AI matching
# (Section 3.4 / 3.9.2). Create the index before deploy:
#   wrangler vectorize create opusos-embeddings --dimensions 768 --metric cosine
# (768 = bge-base-en-v1.5 Workers AI embeddings)
# ============================================================
[[vectorize]]
binding = "VECTOR_INDEX"
index_name = "opusos-embeddings"
index_id = "local-vectorize-index-id"

# ============================================================
# Workers AI - resume parsing / embeddings / summaries
# (Section 12.2). Free tier 10k neurons/day. Binding only works
# with a real Cloudflare account; local dev passes env mock.
# ============================================================
ai = { binding = "AI" }

# ============================================================
# Durable Objects - Team Hub chat rooms (Â§5.5). Free tier 100k req/day.
# Local dev: DOs run in workerd via `wrangler dev --local`.
# ============================================================
[[durable_objects.bindings]]
name = "TEAM_HUB"
class_name = "TeamHubRoom"

[[migrations]]
tag = "v1"
new_classes = ["TeamHubRoom"]

